<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tilt Detector</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050708;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;color:white;touch-action:manipulation}body{display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}.app{width:100%;height:100%;display:grid;grid-template-rows:auto 1fr auto;place-items:center}.title{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#899196;padding-top:6px}.gauge{--c:rgb(255,50,35);position:relative;width:min(78vw,68vh);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.075),transparent 42%),#0b0f11;border:clamp(8px,2.2vw,18px) solid var(--c);box-shadow:0 0 28px color-mix(in srgb,var(--c) 42%,transparent),inset 0 0 35px rgba(0,0,0,.8);transition:border-color .08s linear,box-shadow .08s linear}.gauge:before{content:"";position:absolute;inset:7%;border:1px solid rgba(255,255,255,.08);border-radius:50%}.value{font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(76px,25vw,180px);line-height:.9;letter-spacing:-.07em;margin-left:-.07em;text-shadow:0 2px 15px rgba(0,0,0,.6)}.unit{position:absolute;top:68%;font-size:12px;letter-spacing:.24em;color:#8e979c}.status{height:64px;display:flex;align-items:center;justify-content:center}.button{appearance:none;border:1px solid #5e686e;background:#161c1f;color:#fff;border-radius:999px;padding:13px 22px;font:600 16px system-ui;min-width:190px}.button:active{transform:scale(.98)}.hint{font-size:12px;color:#788187;text-align:center;line-height:1.35}.hidden{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="title">Field Detector</div>
  <div id="gauge" class="gauge"><div id="value" class="value">0</div><div class="unit">RELATIVE SIGNAL</div></div>
  <div class="status"><button id="start" class="button">Enable Detector</button><div id="hint" class="hint hidden">Hold naturally. Tilt left/right to steer the reading.<br>Tap here to recalibrate zero.</div></div>
</div>
<script>
(()=>{
 const gauge=document.getElementById('gauge'), valueEl=document.getElementById('value'), start=document.getElementById('start'), hint=document.getElementById('hint');
 let audio=null, baseline=null, rawTilt=0, target=0, shown=0, lastInt=0, active=false, lastTickAt=0;
 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 function colorFor(v){
   const d=Math.abs(v); let h;
   if(d<=8) h=120; else h=120-(clamp((d-8)/72,0,1)*120);
   const light=d<=8?48:50; return `hsl(${h} 88% ${light}%)`;
 }
 function tick(n){
   if(!audio) return; const now=audio.currentTime;
   // Short percussive click. Pitch rises with signed reading mapped -100..100.
   const freq=380+((n+100)/200)*1250;
   const osc=audio.createOscillator(), gain=audio.createGain();
   osc.type='square'; osc.frequency.setValueAtTime(freq,now);
   gain.gain.setValueAtTime(0.0001,now); gain.gain.exponentialRampToValueAtTime(.075,now+.001); gain.gain.exponentialRampToValueAtTime(.0001,now+.026);
   osc.connect(gain).connect(audio.destination); osc.start(now); osc.stop(now+.03);
 }
 function orientationTilt(e){
   // gamma is left/right tilt in portrait. In landscape, beta is the useful lateral axis.
   const angle=(screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:(window.orientation||0);
   let t=e.gamma||0;
   if(Math.abs(angle)===90) t=(e.beta||0)*(angle===90?-1:1);
   rawTilt=t;
   if(baseline===null) baseline=t;
 }
 function recalibrate(){ baseline=rawTilt; target=shown=0; lastInt=0; valueEl.textContent='0'; }
 function frame(){
   if(active){
     const delta=rawTilt-(baseline??rawTilt);
     // About 18 degrees from calibrated position reaches full scale.
     target=clamp(delta/18*100,-100,100);
     // Low-pass filter: responsive, but conceals hand tremor.
     shown += (target-shown)*0.105;
     if(Math.abs(shown)<0.35) shown=0;
     const current=Math.round(shown);
     if(current!==lastInt){
       const dir=current>lastInt?1:-1;
       // Usually one step/frame; cover skipped boundaries without losing clicks.
       const count=Math.min(8,Math.abs(current-lastInt));
       for(let i=1;i<=count;i++) setTimeout(()=>tick(lastInt+dir*i),i*5);
       lastInt=current;
     }
     valueEl.textContent=current;
     gauge.style.setProperty('--c',colorFor(current));
   }
   requestAnimationFrame(frame);
 }
 async function begin(){
   try{
     audio=new (window.AudioContext||window.webkitAudioContext)(); await audio.resume();
     if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
       const p=await DeviceOrientationEvent.requestPermission(); if(p!=='granted') throw new Error('Motion permission denied');
     }
     window.addEventListener('deviceorientation',orientationTilt,true);
     active=true; start.classList.add('hidden'); hint.classList.remove('hidden');
     setTimeout(recalibrate,350);
   }catch(err){ start.textContent='Motion Access Required'; console.error(err); }
 }
 start.addEventListener('click',begin); hint.addEventListener('click',recalibrate); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
